        - generic [ref=e62]:
          - generic [ref=e63]:
            - generic [ref=e64]:
              - time [ref=e65]: 31 мая 2026 г.
              - generic [ref=e66]: 2 мин чтения
            - 'heading "Эффективность AA и 12 шагов: что показывает обзор Cochrane" [level=1] [ref=e67]'
            - paragraph [ref=e68]: "Разбираем систематический обзор Cochrane: какие результаты AA и двенадцатишаговых программ подтверждены исследованиями и где нужны оговорки."
            - button "В закладки" [ref=e70] [cursor=pointer]
          - generic [ref=e71]:
            - heading "Короткий ответ" [level=2] [ref=e72]
            - paragraph [ref=e73]: Для расстройства, связанного с употреблением алкоголя, AA и клинические программы Twelve-Step Facilitation (TSF) имеют доказательную базу. В систематическом обзоре Cochrane авторы проанализировали 27 исследований с участием 10 565 человек.
            - paragraph [ref=e74]: В сравнении с другими хорошо изученными подходами, такими как когнитивно-поведенческая терапия (CBT), AA/TSF обычно показывали более высокую вероятность полной абстиненции. По части других исходов, включая интенсивность употребления алкоголя, результаты часто были сопоставимы.
            - heading "Что именно изучал обзор" [level=2] [ref=e75]
            - paragraph [ref=e76]: "Важно разделять:"
            - list [ref=e77]:
              - listitem [ref=e78]:
                - strong [ref=e79]: AA
                - text: ": добровольное сообщество взаимопомощи;"
              - listitem [ref=e80]:
                - strong [ref=e81]: TSF
                - text: ": профессионально организованная терапевтическая стратегия, которая помогает человеку познакомиться с принципами 12 шагов и включиться в сообщество."
            - paragraph [ref=e82]: Обзор не утверждает, что один формат подходит каждому человеку. Он сравнивает результаты групп участников и показывает, что AA/TSF является обоснованным вариантом помощи при алкогольной зависимости.
            - heading "Почему выводы имеют практическое значение" [level=2] [ref=e83]
            - paragraph [ref=e84]: AA доступно бесплатно. Поэтому даже умеренное преимущество по абстиненции может быть значимым для людей и систем здравоохранения. Авторы обзора также отмечали потенциальную экономию расходов на медицинскую помощь.
            - heading "Что нельзя заключить из этих данных" [level=2] [ref=e85]
            - paragraph [ref=e86]: "Эти результаты не означают, что:"
            - list [ref=e87]:
              - listitem [ref=e88]: участие гарантирует выздоровление;
              - listitem [ref=e89]: AA заменяет медицинскую помощь при опасной отмене алкоголя;
              - listitem [ref=e90]: выводы автоматически переносятся на каждую форму зависимости;
              - listitem [ref=e91]: человеку нельзя сочетать сообщество, психотерапию и медицинское лечение.
            - heading "Источники" [level=2] [ref=e92]
            - list [ref=e93]:
              - listitem [ref=e94]:
                - text: "Cochrane:"
                - link "Alcoholics Anonymous (AA) and other 12-step programs for alcohol use disorder" [ref=e95] [cursor=pointer]:
                  - /url: https://www.cochrane.org/evidence/CD012880_alcoholics-anonymous-aa-and-other-12-step-programs-alcohol-use-disorder
              - listitem [ref=e96]:
                - text: "Полный текст обзора в PubMed Central:"
                - link "Alcoholics Anonymous and other 12-step programs for alcohol use disorder" [ref=e97] [cursor=pointer]:
                  - /url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7065341/
              - listitem [ref=e98]:
                - text: "Stanford Medicine:"
                - link "Alcoholics Anonymous most effective path to alcohol abstinence" [ref=e99] [cursor=pointer]:
                  - /url: https://med.stanford.edu/news/all-news/2020/03/alcoholics-anonymous-most-effective-path-to-alcohol-abstinence.html
