    - generic [ref=e52]:
      - heading "Что такое 12 шагов" [level=2] [ref=e53]
      - paragraph [ref=e54]: "12 шагов - это структурированная практика личных изменений: честный самоанализ, принятие ответственности, восстановление отношений и регулярная поддержка в сообществе."
      - heading "Краткие факты и история" [level=3] [ref=e55]
      - list [ref=e56]:
        - listitem [ref=e57]: Современная 12-шаговая модель начала формироваться в 1935 году в Акроне (Огайо) вокруг работы Билла Уилсона и доктора Боба Смита.
        - listitem [ref=e58]: В 1939 году была опубликована книга Alcoholics Anonymous, где 12 шагов были описаны как последовательная программа действий.
        - listitem [ref=e59]: "Подход вышел далеко за пределы одной темы: сегодня существуют десятки 12-шаговых сообществ и форматов взаимопомощи, а в нашем каталоге уже 70 направлений."
      - heading "Чем это полезно здоровым людям" [level=3] [ref=e60]
      - paragraph [ref=e61]: "Даже без зависимостей практики 12 шагов можно использовать как систему личной гигиены: регулярная самооценка поведения, признание ошибок, исправление ущерба в отношениях, дисциплина и поддержка сообщества. Такие элементы связаны с ростом психологической устойчивости, снижением изоляции и более стабильными изменениями привычек."
      - paragraph [ref=e62]:
